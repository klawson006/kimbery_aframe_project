<html>
 <head>
   <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
 </head>
 <body>
   <a-scene>
    
     <a-sky src="#sky"></a-sky>

    

     <a-text
       id="shaky-text"
       value="it was so easy once.."
       font="dejavu"
       color="#B2B2FF"
       align="center"
       position="0 3 -4"
       width="7"
       animation="property: position; to: 0.02 3.02 -4; dur: 800; easing: easeInOutQuad; loop: true; dir: alternate">
     </a-text>

     <a-box 
       position="-1 0.5 -3.5" 
       rotation="0 45 0" 
       color="#4CC3D9" 
       scale="0.5 0.5 0.5"
       animation="property: position; to: -1 0.8 -3.5; dur: 2000; easing: easeInOutSine; loop: true; dir: alternate">
     </a-box>

     <a-box 
       position="0 1.25 -3.8" 
       rotation="0 20 0" 
       color="#EF2D5E" 
       scale="0.6 0.6 0.6"
       animation="property: position; to: 0 1.55 -3.8; dur: 2500; easing: easeInOutSine; loop: true; dir: alternate">
     </a-box>

     <a-box 
       position="1 0.75 -3.6" 
       rotation="0 -15 0" 
       color="#FFC65D" 
       scale="0.4 0.4 0.4"
       animation="property: position; to: 1 1.0 -3.6; dur: 1800; easing: easeInOutSine; loop: true; dir: alternate">
     </a-box>

     <a-cone
       segments-radial="3"
       color="#9370DB"
       radius-bottom="0.5"
       height="1"
       position="-5 2 -6"
       animation="property: position; to: -5 3 -6; dur: 3000; easing: easeInOutSine; loop: true; dir: alternate"
       animation__rotate="property: rotation; to: 360 360 0; dur: 10000; easing: linear; loop: true">
     </a-cone>

     <a-cone
       segments-radial="3"
       color="#87CEFA"
       radius-bottom="0.3"
       height="0.6"
       position="5 1.5 -5"
       animation="property: position; to: 5 2.2 -5; dur: 3500; easing: easeInOutSine; loop: true; dir: alternate"
       animation__rotate="property: rotation; to: 0 360 360; dur: 12000; easing: linear; loop: true">
     </a-cone>

     <a-cone
       segments-radial="3"
       color="#FFB6C1"
       radius-bottom="0.4"
       height="0.8"
       position="2 5 -8"
       animation="property: position; to: 2 4.5 -8; dur: 4000; easing: easeInOutSine; loop: true; dir: alternate"
       animation__rotate="property: rotation; to: 360 0 360; dur: 15000; easing: linear; loop: true">
     </a-cone>

     <a-gltf-model
       src="#character"
       position="0 0 -4"
       scale="0.5 0.5 0.5"></a-gltf-model>
   </a-scene>

   <script>
     const fonts = ['dejavu', 'roboto', 'aileron', 'exo2', 'kelsonsans', 'monoid'];
     let index = 0;
     const textEntity = document.querySelector('#shaky-text');

     setInterval(() => {
       index = (index + 1) % fonts.length;
       textEntity.setAttribute('font', fonts[index]);
     }, 1000);
   </script>
 </body>
</html>
